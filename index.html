<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cuttable3D</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700;900&display=swap" />

    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }

      body {
        background: #0d0d18;
        overflow: hidden;
        font-family: 'Space Grotesk', system-ui, sans-serif;
        color: #fff;
        user-select: none;
      }

      canvas { display: block; }

      /* ── cut-gesture overlay (full screen, behind UI) ── */
      #cut-overlay {
        position: fixed; inset: 0;
        pointer-events: none;
        z-index: 5;
      }

      /* ── wordmark (top-left, GitHub link) ── */
      #wordmark {
        position: fixed; top: 14px; left: 16px;
        z-index: 30;
        text-decoration: none;
        display: block;
        font-size: 13px; font-weight: 900; letter-spacing: 0.20em;
        color: #00eeff;
        text-shadow: 0 0 12px #00eeff66;
        text-transform: uppercase;
        white-space: nowrap;
        line-height: 1;
      }

      /* ── score HUD (top-right) ── */
      #score-block {
        position: fixed; top: 12px; right: 16px;
        z-index: 30;
        text-align: right;
        line-height: 1.1;
        pointer-events: none;
      }
      #notice {
        position: fixed; top: 58px; right: 16px;
        z-index: 30;
        max-width: 200px;
        padding: 5px 10px;
        background: rgba(6,6,18,0.72);
        border: 1px solid rgba(255,60,60,0.30);
        border-radius: 8px;
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        text-align: right;
        font-size: 10px; font-weight: 700;
        letter-spacing: 0.07em;
        color: #ff5555;
        line-height: 1.45;
        pointer-events: none;
        opacity: 0;
        transform: translateY(-4px);
        transition: opacity 0.18s ease, transform 0.18s ease;
      }
      #notice.show { opacity: 1; transform: translateY(0); }
      .score-row {
        font-size: 10px; font-weight: 700;
        letter-spacing: 0.12em;
        color: rgba(255,255,255,0.35);
        text-transform: uppercase;
        display: flex; align-items: baseline; gap: 5px; justify-content: flex-end;
      }
      .score-row .n {
        font-size: 16px; font-weight: 900;
        color: rgba(255,255,255,0.85);
        letter-spacing: 0;
        min-width: 22px; text-align: right;
      }

      /* ── projection toggle (below ViewCube) ── */
      #proj-btn {
        margin-top: 8px;
        width: 88px; height: 26px;
        display: flex; align-items: center; justify-content: center;
        background: rgba(6,6,18,0.70);
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 8px;
        color: rgba(255,255,255,0.55);
        font-family: inherit; font-size: 9px; font-weight: 700;
        letter-spacing: 0.10em;
        text-transform: uppercase;
        cursor: pointer;
        transition: background 0.12s, color 0.12s, border-color 0.12s;
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
      }
      #proj-btn:hover {
        background: rgba(255,255,255,0.07);
        color: rgba(255,255,255,0.85);
        border-color: rgba(255,255,255,0.22);
      }

      /* ── bottom-right file buttons ── */
      #file-btns {
        position: fixed; bottom: 18px; right: 18px;
        display: flex; flex-direction: row; align-items: center; gap: 8px;
        z-index: 20;
      }
      .file-btn {
        display: flex; align-items: center; gap: 8px;
        padding: 9px 16px;
        background: rgba(6,6,18,0.82);
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 10px;
        color: rgba(255,255,255,0.65);
        font-family: inherit; font-size: 12px; font-weight: 600;
        letter-spacing: 0.06em;
        cursor: pointer;
        transition: background 0.12s, color 0.12s, border-color 0.12s;
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        white-space: nowrap;
      }
      .file-btn:hover {
        background: rgba(255,255,255,0.07);
        color: #fff;
        border-color: rgba(255,255,255,0.22);
      }

      /* ── left toolbar ── */
      #toolbar {
        position: fixed; left: 14px; top: 50%; transform: translateY(-50%);
        display: flex; flex-direction: column; align-items: center; gap: 3px;
        padding: 8px 7px;
        background: rgba(6,6,18,0.70);
        border: 1px solid rgba(255,255,255,0.09);
        border-radius: 14px;
        z-index: 20;
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        box-shadow: 0 4px 24px rgba(0,0,0,0.35);
      }

      .tool-btn {
        width: 38px; height: 38px;
        display: flex; align-items: center; justify-content: center;
        background: none;
        border: 1px solid transparent;
        border-radius: 9px;
        color: rgba(255,255,255,0.38);
        cursor: pointer;
        transition: background 0.12s, border-color 0.12s, color 0.12s, box-shadow 0.12s;
        position: relative;
        padding: 0;
      }
      .tool-btn:hover {
        background: rgba(255,255,255,0.07);
        color: rgba(255,255,255,0.72);
        border-color: rgba(255,255,255,0.12);
      }
      .tool-btn.active {
        background: rgba(0,238,255,0.13);
        border-color: rgba(0,238,255,0.42);
        color: #00eeff;
        box-shadow: 0 0 10px rgba(0,238,255,0.18), inset 0 0 6px rgba(0,238,255,0.06);
      }
      .tool-btn[data-key]::after {
        content: attr(data-key);
        position: absolute; bottom: 3px; right: 4px;
        font-size: 7px; font-weight: 700; letter-spacing: 0;
        opacity: 0.38; line-height: 1; font-family: monospace;
      }

      .toolbar-sep {
        width: 22px; height: 1px;
        background: rgba(255,255,255,0.10);
        margin: 3px 0;
      }

      .action-btn {
        width: 38px; height: 34px;
        display: flex; align-items: center; justify-content: center;
        background: none;
        border: 1px solid transparent;
        border-radius: 9px;
        color: rgba(255,255,255,0.32);
        cursor: pointer;
        transition: background 0.12s, border-color 0.12s, color 0.12s;
        padding: 0;
      }
      .action-btn:hover:not(:disabled) {
        background: rgba(255,255,255,0.07);
        color: rgba(255,255,255,0.72);
        border-color: rgba(255,255,255,0.12);
      }
      .action-btn:disabled {
        opacity: 0.22;
        cursor: not-allowed;
      }

      /* ── view nav widget (bottom-left) ── */
      #view-nav {
        position: fixed; bottom: 18px; left: 18px;
        display: flex; flex-direction: column; align-items: center; gap: 0;
        z-index: 20;
      }

      /* 3-D cube scene */
      #vc-scene {
        width: 88px; height: 88px;
        perspective: 280px;
        display: flex; align-items: center; justify-content: center;
        cursor: pointer;
      }
      #vc-cube {
        width: 60px; height: 60px;
        transform-style: preserve-3d;
        position: relative;
      }
      .vc-face {
        position: absolute; inset: 0;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 2px;
        font-family: 'Space Grotesk', monospace;
        font-size: 7px; font-weight: 700; letter-spacing: 0.1em;
        text-transform: uppercase;
        color: rgba(255,255,255,0.42);
        background: rgba(4,12,22,0.80);
        border: 1px solid rgba(255,255,255,0.12);
        cursor: pointer;
        user-select: none;
        backface-visibility: visible;
        box-sizing: border-box;
        transition: background 0.12s, color 0.12s;
      }
      .vc-face:hover {
        background: rgba(0,238,255,0.16);
        color: #00eeff;
        border-color: rgba(0,238,255,0.45);
      }
      .vc-axis {
        font-size: 8px; font-weight: 900; line-height: 1;
        opacity: 0.7;
      }
      .vc-dir { line-height: 1; }

      /* axis colors: Z=blue, X=red, Y=green */
      .vc-front, .vc-back   { border-color: rgba(60,140,255,0.30); }
      .vc-front .vc-axis, .vc-back .vc-axis { color: #4a90ff; }
      .vc-right, .vc-left   { border-color: rgba(255,80,60,0.30); }
      .vc-right .vc-axis, .vc-left .vc-axis { color: #ff5040; }
      .vc-top, .vc-bottom   { border-color: rgba(60,220,100,0.30); }
      .vc-top .vc-axis, .vc-bottom .vc-axis { color: #3ddc64; }

      /* face transforms: 60px face, 30px half-size */
      .vc-front  { transform: rotateY(  0deg) translateZ(30px); }
      .vc-back   { transform: rotateY(180deg) translateZ(30px); }
      .vc-right  { transform: rotateY( 90deg) translateZ(30px); }
      .vc-left   { transform: rotateY(-90deg) translateZ(30px); }
      .vc-top    { transform: rotateX( 90deg) translateZ(30px); }
      .vc-bottom { transform: rotateX(-90deg) translateZ(30px); }


      /* ── right toolbar (cut mode) ── */
      #right-toolbar {
        position: fixed; right: 14px; top: 50%; transform: translateY(-50%);
        display: flex; flex-direction: column; align-items: center; gap: 3px;
        padding: 8px 7px;
        background: rgba(6,6,18,0.70);
        border: 1px solid rgba(255,255,255,0.09);
        border-radius: 14px;
        z-index: 20;
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        box-shadow: 0 4px 24px rgba(0,0,0,0.35);
      }

      /* ── bottom hint ── */
      #hints {
        position: fixed; bottom: 14px;
        left: 50%; transform: translateX(-50%);
        max-width: calc(100vw - 280px); /* leave room for export btn (right) and nav cube (left) */
        text-align: center;
        font-size: 11px;
        font-weight: 400;
        letter-spacing: 0.06em;
        color: rgba(255,255,255,0.22);
        pointer-events: none;
        z-index: 20;
        line-height: 1.6;
      }

      /* ── status message (hidden   kept for JS compatibility) ── */
      #status { display: none; }

      /* ── reconstruction mode ── */
      #recon-hud {
        display: none;
        position: fixed; top: 14px; left: 50%; transform: translateX(-50%);
        flex-direction: row; align-items: center; gap: 18px;
        padding: 7px 18px;
        background: rgba(6,6,18,0.85);
        border: 1px solid rgba(255,255,255,0.10);
        border-radius: 12px;
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        z-index: 26;
        white-space: nowrap;
      }
      #recon-hud.show { display: flex; }
      #recon-difficulty {
        font-size: 10px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase;
      }
      #recon-timer {
        font-size: 22px; font-weight: 700; letter-spacing: 0.04em;
        color: rgba(255,255,255,0.9); font-variant-numeric: tabular-nums;
        min-width: 60px; text-align: center;
      }
      #recon-progress {
        font-size: 11px; font-weight: 600; color: rgba(255,255,255,0.45);
        letter-spacing: 0.06em;
      }
      .recon-sep { width: 1px; height: 22px; background: rgba(255,255,255,0.10); }
      .recon-btn {
        padding: 5px 12px;
        font-size: 10px; font-weight: 700; letter-spacing: 0.08em;
        color: rgba(255,255,255,0.5);
        background: none;
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 7px;
        cursor: pointer;
        font-family: inherit;
        transition: background 0.12s, color 0.12s, border-color 0.12s;
      }
      .recon-btn:hover { background: rgba(255,255,255,0.07); color: rgba(255,255,255,0.85); border-color: rgba(255,255,255,0.22); }
      .recon-btn.active { color: #00eeff; border-color: rgba(0,238,255,0.42); background: rgba(0,238,255,0.08); }

      /* floating number labels (help mode) */
      .recon-label {
        position: fixed; pointer-events: none; z-index: 27;
        width: 20px; height: 20px;
        display: flex; align-items: center; justify-content: center;
        font-size: 9px; font-weight: 900; letter-spacing: 0;
        border-radius: 50%;
        opacity: 0;
        transition: opacity 0.2s;
      }
      .recon-label-piece {
        color: #fff;
        background: rgba(20,20,40,0.88);
        border: 1px solid rgba(255,255,255,0.25);
      }
      .recon-label-ghost {
        color: #88aaff;
        background: rgba(20,20,60,0.72);
        border: 1px solid rgba(100,140,255,0.35);
      }

      /* completion overlay */
      #recon-complete {
        display: none;
        position: fixed; inset: 0;
        align-items: center; justify-content: center;
        background: rgba(2,4,14,0.72);
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
        z-index: 40;
      }
      #recon-complete.show { display: flex; }
      #recon-complete-inner {
        padding: 36px 44px;
        background: rgba(6,6,20,0.95);
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 18px;
        text-align: center;
        display: flex; flex-direction: column; align-items: center; gap: 10px;
        min-width: 260px;
      }
      #recon-complete-inner h2 {
        font-size: 28px; font-weight: 900; letter-spacing: 0.1em;
        color: #ffdd00;
        text-shadow: 0 0 30px rgba(255,220,0,0.5);
        margin: 0;
      }
      #recon-complete-diff { font-size: 11px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; }
      #recon-complete-time { font-size: 13px; font-weight: 600; color: rgba(255,255,255,0.5); letter-spacing: 0.06em; }
      #recon-complete-score { font-size: 42px; font-weight: 900; color: #fff; font-variant-numeric: tabular-nums; line-height: 1; }
      #recon-complete-score span { font-size: 13px; font-weight: 600; color: rgba(255,255,255,0.35); letter-spacing: 0.08em; }
      #recon-complete-actions { display: flex; gap: 10px; margin-top: 8px; }
      #recon-complete-actions button {
        padding: 9px 20px;
        font-size: 11px; font-weight: 700; letter-spacing: 0.08em;
        border-radius: 9px; cursor: pointer; font-family: inherit;
        border: 1px solid rgba(255,255,255,0.15);
        background: rgba(255,255,255,0.05);
        color: rgba(255,255,255,0.7);
        transition: background 0.12s, color 0.12s;
      }
      #recon-complete-actions button:hover { background: rgba(255,255,255,0.10); color: #fff; }
      #recon-retry-btn { border-color: rgba(0,238,255,0.35) !important; color: #00eeff !important; }
      #recon-retry-btn:hover { background: rgba(0,238,255,0.10) !important; }

      /* ── big centre feedback (SLICED! / COMBO ×3) ── */
      #feedback {
        position: fixed; top: 50%; left: 50%;
        transform: translate(-50%, -60%);
        pointer-events: none;
        z-index: 30;
        text-align: center;
        opacity: 0;
      }
      #feedback-text {
        font-size: 56px;
        font-weight: 900;
        letter-spacing: 0.06em;
        line-height: 1;
        color: #ffdd00;
        text-shadow: 0 0 40px #ffdd0066, 0 2px 0 rgba(0,0,0,0.4);
        white-space: nowrap;
      }
      #feedback-sub {
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0.18em;
        color: rgba(255,255,255,0.6);
        text-transform: uppercase;
        margin-top: 4px;
      }
    </style>
    <script type="module" crossorigin src="/cuttable3d/assets/index-CUzyod0-.js"></script>
  </head>
  <body>
    <!-- 2-D gesture overlay -->
    <canvas id="cut-overlay"></canvas>

    <!-- Wordmark (GitHub link) -->
    <a href="https://rendyrayana.my.id/cuttable3d/" id="wordmark" target="_blank" rel="noopener">CUTTABLE3D</a>

    <!-- Score HUD (top-right) -->
    <div id="score-block">
      <div class="score-row"><span class="n" id="cut-count">0</span> cuts</div>
      <div class="score-row"><span class="n" id="piece-count">1</span> pieces</div>
    </div>
    <!-- Red notice line, sits just below score block -->
    <div id="notice"></div>

    <!-- Bottom-right file buttons (Export left, Import right) -->
    <div id="file-btns">
      <button class="file-btn" id="export-btn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        Export STL
      </button>
      <button class="file-btn" id="import-btn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Import STL
      </button>
    </div>

    <!-- Left toolbar -->
    <div id="toolbar">
      <!-- Pointer tool (1) -->
      <button class="tool-btn active" data-tool="pointer" data-key="1" title="Pointer (1)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
          <path d="M4 0l.001 16.5 4.5-4.5L11 18l2.5-1L11 11.5H17L4 0z"/>
        </svg>
      </button>
      <!-- Cut tool (2) -->
      <button class="tool-btn" data-tool="cut-straight" data-key="2" title="Cut (2)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/>
          <line x1="20" y1="4" x2="8.12" y2="15.88"/>
          <line x1="14.47" y1="14.48" x2="20" y2="20"/>
          <line x1="8.12" y1="8.12" x2="12" y2="12"/>
        </svg>
      </button>
      <!-- Separator -->
      <div class="toolbar-sep"></div>
      <!-- Transform tool (3) -->
      <button class="tool-btn" data-tool="transform" data-key="3" title="Transform (3)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 9l-3 3 3 3"/><path d="M19 9l3 3-3 3"/>
          <path d="M9 5l3-3 3 3"/><path d="M15 19l-3 3-3-3"/>
          <line x1="2" y1="12" x2="22" y2="12"/>
          <line x1="12" y1="2" x2="12" y2="22"/>
        </svg>
      </button>
      <!-- Stand tool (4) -->
      <button class="tool-btn" data-tool="hand" data-key="4" title="Stand on face (4)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <line x1="3" y1="21" x2="21" y2="21" stroke-width="2"/>
          <rect x="6" y="9" width="12" height="10" rx="1.5"/>
          <path d="M12 4 L12 7.5" stroke-width="1.5"/>
          <path d="M10 5.8 L12 3.5 L14 5.8" stroke-width="1.5"/>
        </svg>
      </button>
      <!-- Separator -->
      <div class="toolbar-sep"></div>
      <!-- Undo -->
      <button class="action-btn" id="undo-btn" title="Undo (Ctrl+Z)" disabled>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 7v6h6"/><path d="M3 13C5.23 7.93 10 4 16 4a9 9 0 0 1 9 9 9 9 0 0 1-9 9 9 9 0 0 1-7.72-4.38"/>
        </svg>
      </button>
      <!-- Redo -->
      <button class="action-btn" id="redo-btn" title="Redo (Ctrl+Y)" disabled>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 7v6h-6"/><path d="M21 13a9 9 0 0 0-9-9 9 9 0 0 0-9 9 9 9 0 0 0 9 9 7.77 7.77 0 0 0 4.38-1.35"/>
        </svg>
      </button>
      <!-- Separator -->
      <div class="toolbar-sep"></div>
      <!-- Puzzle / Reconstruct -->
      <button class="action-btn" id="recon-btn" title="Puzzle mode — reassemble cut pieces" disabled>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="2" width="8" height="8" rx="1.5"/>
          <rect x="14" y="2" width="8" height="8" rx="1.5"/>
          <rect x="2" y="14" width="8" height="8" rx="1.5"/>
          <rect x="14" y="14" width="8" height="8" rx="1.5"/>
        </svg>
      </button>
    </div>

    <!-- Status pill -->
    <div id="status">Loading…</div>

    <!-- Hint bar -->
    <div id="hints">click &amp; drag = pick &amp; throw &nbsp;·&nbsp; double-click = isolate &nbsp;·&nbsp; scroll = lay flat &nbsp;·&nbsp; right-drag = orbit</div>

    <!-- View nav widget: 3-D cube (bottom-left) -->
    <div id="view-nav">
      <div id="vc-scene">
        <div id="vc-cube">
          <div class="vc-face vc-front"  data-snap="front"><span class="vc-axis">Z</span><span class="vc-dir">FRONT</span></div>
          <div class="vc-face vc-back"   data-snap="back"><span class="vc-axis">Z</span><span class="vc-dir">BACK</span></div>
          <div class="vc-face vc-right"  data-snap="right"><span class="vc-axis">X</span><span class="vc-dir">RIGHT</span></div>
          <div class="vc-face vc-left"   data-snap="left"><span class="vc-axis">X</span><span class="vc-dir">LEFT</span></div>
          <div class="vc-face vc-top"    data-snap="top"><span class="vc-axis">Y</span><span class="vc-dir">TOP</span></div>
          <div class="vc-face vc-bottom" data-snap="bottom"><span class="vc-axis">Y</span><span class="vc-dir">BTM</span></div>
        </div>
      </div>
      <button id="proj-btn" title="Toggle perspective / orthographic">PERSP</button>
    </div>

    <!-- Right toolbar: cut mode selector -->
    <div id="right-toolbar">
      <!-- Flat cut (default) -->
      <button class="tool-btn mode-btn active" id="mode-flat" title="Flat cut   no joint">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="5" width="8" height="14" rx="1.5"/>
          <rect x="14" y="5" width="8" height="14" rx="1.5"/>
        </svg>
      </button>
      <div class="toolbar-sep"></div>
      <!-- Joint cut -->
      <button class="tool-btn mode-btn" id="mode-joint" title="Joint cut   place peg after slice">
        <svg width="18" height="18" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
          <!-- puzzle piece: top tab (arc up), right tab (arc right), left notch (arc inward), flat bottom -->
          <path d="
            M 15,20
            L 37,20
            A 13,13 0 0 1 63,20
            L 80,20
            L 80,37
            A 13,13 0 0 1 80,63
            L 80,80
            L 15,80
            L 15,63
            A 13,13 0 0 0 15,37
            Z
          "/>
        </svg>
      </button>
    </div>

    <!-- Reconstruction HUD -->
    <div id="recon-hud">
      <span id="recon-difficulty"></span>
      <div class="recon-sep"></div>
      <span id="recon-timer">0.0s</span>
      <span id="recon-progress">0 / 0</span>
      <div class="recon-sep"></div>
      <button class="recon-btn" id="recon-help-btn">HELP</button>
      <button class="recon-btn" id="recon-reset-btn">RESET</button>
      <button class="recon-btn" id="recon-exit-btn">EXIT</button>
    </div>

    <!-- Reconstruction completion modal -->
    <div id="recon-complete">
      <div id="recon-complete-inner">
        <h2>COMPLETE</h2>
        <div id="recon-complete-diff"></div>
        <div id="recon-complete-time"></div>
        <div id="recon-complete-score">0<span> pts</span></div>
        <div id="recon-complete-actions">
          <button id="recon-retry-btn">Try Again</button>
          <button id="recon-back-btn">Back to Cutting</button>
        </div>
      </div>
    </div>

    <!-- Juicy feedback pop -->
    <div id="feedback">
      <div id="feedback-text"></div>
      <div id="feedback-sub"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  </body>
</html>
